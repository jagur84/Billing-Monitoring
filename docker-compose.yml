name: billing-monitoring

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: billing-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      - CONTAINER_ROLE=app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - billing-net

  nginx:
    image: nginx:alpine
    container_name: billing-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - billing-net

  mysql:
    image: mysql:8.0
    container_name: billing-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-billing_monitoring}
      MYSQL_USER: ${DB_USERNAME:-billing}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secretroot}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secretroot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - billing-net

  redis:
    image: redis:alpine
    container_name: billing-redis
    restart: unless-stopped
    networks:
      - billing-net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: billing-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan queue:work --tries=3 --backoff=10 --sleep=3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - billing-net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: billing-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - billing-net

  whatsapp:
    build:
      context: .
      dockerfile: docker/whatsapp/Dockerfile
    container_name: billing-whatsapp
    restart: unless-stopped
    volumes:
      - whatsapp_auth_data:/app/auth
    ports:
      - "3010:3000"
    networks:
      - billing-net

  node:
    image: node:20-alpine
    container_name: billing-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles: ["dev-assets"]
    networks:
      - billing-net

networks:
  billing-net:
    driver: bridge

volumes:
  dbdata:
  vendor_data:
  node_modules_data:
  whatsapp_auth_data:
